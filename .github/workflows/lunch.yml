name: 밥플러스 점심 메뉴 슬랙 알림

on:
  # 예약 실행은 외부 스케줄러(val.town)가 평일 11:00 KST에 workflow_dispatch로 트리거.
  # (GitHub schedule cron은 누락이 잦아 제거함)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "슬랙 전송 없이 동작만 테스트"
        type: boolean
        default: false

concurrency:
  group: lunch-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (tesseract + 한글 데이터)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          pip install -r requirements.txt

      - name: 오늘 날짜(KST) 계산
        id: d
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      # 같은 날 여러 실행 간 "이미 전송됨" 공유 (중복 전송 방지)
      - name: 전송 마커 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: .sent_marker
          key: lunch-sent-${{ steps.d.outputs.today }}

      - name: Run lunch bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SENT_MARKER: .sent_marker
          DRY_RUN: ${{ inputs.dry_run }}
        run: python lunch_bot.py
