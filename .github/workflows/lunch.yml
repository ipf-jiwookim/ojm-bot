name: 밥플러스 점심 메뉴 슬랙 알림

on:
  schedule:
    # UTC 02:30 = KST 11:30, 월~금 (1차)
    - cron: "30 2 * * 1-5"
    # UTC 03:00 = KST 12:00, 월~금 (재시도 — 11:30에 미등록이었던 경우 대비)
    - cron: "0 3 * * 1-5"
  workflow_dispatch: {}   # 웹/CLI에서 수동 실행

concurrency:
  group: lunch-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (tesseract + 한글 데이터)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          pip install -r requirements.txt

      - name: 오늘 날짜(KST) 계산
        id: d
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      # 같은 날 11:30/12:00 두 실행 간 "이미 전송됨" 공유 (중복 전송 방지)
      - name: 전송 마커 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: .sent_marker
          key: lunch-sent-${{ steps.d.outputs.today }}

      - name: Run lunch bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SENT_MARKER: .sent_marker
        run: python lunch_bot.py
